    <h2>Art</h2>
    <p class="sub">Selected visual work.</p>
    <div class="gallery">
      <figure class="art"><div class="frame"><img src="images/art-sun.jpg" alt="Painting of a woman in profile raising her arms toward a blazing sun"></div>
        <figcaption><b>Sunward</b>Painting on canvas &middot; 2025<span>A woman in profile lifts her arms toward a blazing sun, her patterned dress carrying the colors of the sky around her.</span></figcaption></figure>
      <figure class="art"><div class="frame"><img src="images/art-africa.jpg" alt="Painting of the map of Africa forming a woman's face, filled with forests and flowers"></div>
        <figcaption><b>Mother Continent</b>Painting on canvas &middot; 2025<span>The map of Africa becomes a woman's face, its outline filled with forests, flowers and living things.</span></figcaption></figure>
      <figure class="art wide"><div class="frame"><img src="images/art-triptych.jpg" alt="Abstract triptych of flowing, interlocking shapes in bright colors"></div>
        <figcaption><b>Confluence</b>Triptych, painting on canvas &middot; 2025<span>Three panels of flowing, interlocking shapes move from earthy oranges and greens through violet to vivid pinks and blues, joined by a single band that runs across all three.</span></figcaption></figure>
      <figure class="art mid"><div class="frame"><img src="images/maames-oracle.jpg" alt="Maame's Oracle: concentric circles in pastel crayon, 2022"></div>
        <figcaption><b>Maame&rsquo;s Oracle</b>Pastel crayon &middot; 2022<span>Rings of color spiral outward from a glowing center, each layer drawn by hand.</span></figcaption></figure>
